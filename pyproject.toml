[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutsumi-voca"
version = "0.1.0"
description = "CPU-first voice and short-video workflow tools"
requires-python = ">=3.9"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
video = ["Pillow>=11,<12"]

[project.scripts]
voca = "voca.cli:main"

[tool.setuptools.packages.find]
include = ["voca*"]
